<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600">
  <title>DemandDrive Studio logo</title>
  <desc>Vector recreation of the first logo concept: navy D emblem with an electric-blue rising arrow and two-tone wordmark.</desc>
  <rect width="1600" height="600" fill="#FFFFFF"/>
  <g id="icon" transform="translate(160 190)">
    <!-- Geometric D mark -->
    <path d="M0,0 H125 C207,0 255,48 255,130 C255,212 207,260 125,260 H58 L113,205 H128 C166,205 187,177 187,130 C187,83 166,55 128,55 H55 V104 L0,160 Z" fill="#0B1F3A"/>
    <!-- Rising arrow cut across the D -->
    <path d="M0,260 L73,260 L151,182 L173,204 L173,126 L95,126 L117,148 Z" fill="#1769FF"/>
    <!-- small white separation for crisp geometry -->
    <path d="M73,260 L95,260 L173,182 L173,204 L195,182 L173,160 L151,182 Z" fill="#FFFFFF" opacity="0"/>
  </g>
  <g id="wordmark">
    <text x="455" y="360" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="700" letter-spacing="-4" fill="#0B1F3A">Demand</text>
    <text x="840" y="360" font-family="Arial, Helvetica, sans-serif" font-size="112" font-weight="700" letter-spacing="-4" fill="#1769FF">Drive</text>
    <text x="460" y="438" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="400" letter-spacing="18" fill="#0B1F3A">STUDIO</text>
  </g>
</svg>